services:
  backend:
    build: ./backend
    container_name: essu-inventory-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    container_name: essu-inventory-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
